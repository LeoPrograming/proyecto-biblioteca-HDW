name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: stm_biblioteca_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/stm_biblioteca_test?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: root
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/stm_biblioteca_test?allowPublicKeyRetrieval=true&useSSL=false
      TEST_DB_USERNAME: root
      TEST_DB_PASSWORD: root

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Dar permisos al Maven Wrapper
        run: chmod +x mvnw

      - name: Instalar dependencias y compilar
        run: ./mvnw -B compile

      - name: Ejecutar pruebas automaticas
        run: ./mvnw -B test