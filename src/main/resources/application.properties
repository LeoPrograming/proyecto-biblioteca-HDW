# Configuracion base de STM Biblioteca
spring.application.name=stm-biblioteca

# Configuracion local opcional desde archivo .env
spring.config.import=optional:file:.env[.properties]

# Conexion MySQL mediante variables de entorno
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# La base ya existe: Hibernate no debe crear, modificar ni eliminar tablas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}