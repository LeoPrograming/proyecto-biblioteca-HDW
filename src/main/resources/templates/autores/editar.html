<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Editar Autor')}"></head>

<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="form-page">

    <div class="form-card">

        <h1 class="form-title">
            Editar Autor
        </h1>

        <div
                id="mensajeEditarAutor"
                class="form-message">
        </div>

        <form id="formEditarAutor">

            <input
                    type="hidden"
                    id="idAutorEditar">

            <div class="form-grid">

                <div class="form-field">

                    <label for="nombresAutorEditar">
                        Nombres
                    </label>

                    <input
                            type="text"
                            id="nombresAutorEditar"
                            required>

                </div>


                <div class="form-field">

                    <label for="apellidosAutorEditar">
                        Apellidos
                    </label>

                    <input
                            type="text"
                            id="apellidosAutorEditar">

                </div>

            </div>

            <div class="form-actions">

                <button
                        type="submit"
                        class="btn btn-blue">
                    Guardar cambios
                </button>

                <a
                        th:href="@{/autores}"
                        class="btn btn-gray">
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</main>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
