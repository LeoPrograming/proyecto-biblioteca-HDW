<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Gestión de Lectores')}"></head>

<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="management-container">

    <div class="management-header">
        <h1>Gestión de Lectores</h1>
    </div>

    <div class="action-bar">
        <button class="btn btn-blue" id="btnAgregarLector">Agregar</button>

        <button class="btn btn-yellow"
                id="btnEditarLector"
                disabled>
            Editar
        </button>

        <button class="btn btn-red"
                id="btnEstadoLector"
                disabled>
            Cambiar estado
        </button>

        <a th:href="@{/dashboard}" class="btn btn-gray">
            Regresar
        </a>
    </div>

    <div class="usuarios-search">
        <input
                type="text"
                id="buscarLector"
                placeholder="Buscar por DNI o usuario">

        <button class="btn btn-blue" id="btnBuscarLector">
            Buscar
        </button>

        <button class="btn btn-gray" id="btnLimpiarBusquedaLector">
            Mostrar todos
        </button>
    </div>

    <div id="mensajeLectores" class="mensaje"></div>

    <div class="table-wrapper">
        <table class="management-table">

            <thead>
            <tr>
                <th></th>
                <th>ID</th>
                <th>DNI</th>
                <th>Usuario</th>
                <th>Nombres</th>
                <th>Apellidos</th>
                <th>Correo</th>
                <th>Teléfono</th>
                <th>Dirección</th>
                <th>Estado</th>
            </tr>
            </thead>

            <tbody id="tablaLectores">
            <tr>
                <td colspan="10">
                    Cargando lectores...
                </td>
            </tr>
            </tbody>

        </table>
    </div>

</main>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
