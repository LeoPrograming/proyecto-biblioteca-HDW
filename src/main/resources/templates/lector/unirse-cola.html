<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Unirme a Cola')}"></head>

<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="admin-container">

    <section style="
        text-align:center;
        padding-top:35px;
        margin-bottom:30px;
    ">

        <h1 style="
            color:#0b5ed7;
            font-size:34px;
            margin-bottom:10px;
        ">
            Unirme a Cola de Espera
        </h1>

        <p style="color:#666;">
            Te avisaremos cuando el libro vuelva a estar disponible.
        </p>

    </section>


    <section style="
        max-width:650px;
        margin:0 auto 50px auto;
    ">

        <div style="
            background:white;
            border-radius:14px;
            padding:30px;
            box-shadow:0 4px 14px rgba(0,0,0,0.08);
        ">

            <div id="detalleLibroCola"
                 style="text-align:center;">
                Cargando libro...
            </div>

            <div id="mensajeUnirseCola"
                 class="form-message">
            </div>

            <div style="
                display:flex;
                gap:12px;
                justify-content:center;
                margin-top:25px;
            ">

                <button
                        type="button"
                        id="btnUnirseCola"
                        class="btn btn-blue">

                    Confirmar y unirme

                </button>

                <a href="/lector/catalogo"
                   class="btn btn-gray">
                    Cancelar
                </a>

            </div>

        </div>

    </section>

</main>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/lector.js}"></script>

</body>
</html>
