<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Reservar Libro')}"></head>

<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="admin-container">

    <section style="
        max-width: 650px;
        margin: 40px auto;
    ">

        <div class="form-card">

            <h1 style="text-align:center;">
                Confirmar Reserva
            </h1>

            <div id="detalleLibroReserva"
                 style="margin: 25px 0;">
                Cargando libro...
            </div>

            <form id="formReservaLector">

                <div class="form-group">

                    <label for="diasReserva">
                        Cantidad de días
                    </label>

                    <input
                            type="number"
                            id="diasReserva"
                            min="1"
                            max="30"
                            value="1"
                            required>

                </div>

                <div id="totalReserva"
                     style="
                        margin-top: 20px;
                        font-weight: bold;
                    ">
                </div>

                <div id="mensajeReserva"
                     class="form-message">
                </div>

                <div style="
                    margin-top: 25px;
                    display: flex;
                    gap: 12px;
                    justify-content: center;
                ">

                    <button
                            type="submit"
                            class="btn btn-blue">
                        Confirmar Reserva
                    </button>

                    <a th:href="@{/lector/catalogo}"
                       class="btn btn-gray">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>

    </section>

</main>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/lector.js}"></script>

</body>

</html>
