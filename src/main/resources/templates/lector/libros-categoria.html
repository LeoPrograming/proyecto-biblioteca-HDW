<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Libros por Categoría')}"></head>

<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="admin-container">

    <section style="
        text-align: center;
        padding-top: 35px;
        margin-bottom: 40px;
    ">

        <h1 id="tituloCategoria"
            style="
                color: #0b5ed7;
                font-size: 34px;
                margin: 0 0 14px 0;
            ">
            Libros
        </h1>

        <p style="
            margin: 0 0 24px 0;
            font-size: 17px;
            color: #666;
        ">
            Consulta los libros disponibles en esta categoría.
        </p>

        <a th:href="@{/lector/catalogo}"
           class="btn btn-gray">
            Volver a categorías
        </a>

    </section>


    <section style="margin-top: 20px;">

        <div id="librosCategoriaLector"
             class="module-grid">

            <div style="
                width: 100%;
                text-align: center;
                padding: 40px;
            ">
                Cargando libros...
            </div>

        </div>

    </section>

</main>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/lector.js}"></script>

</body>

</html>
