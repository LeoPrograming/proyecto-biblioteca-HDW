<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Mi Cola de Espera')}"></head>

<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="admin-container">

    <section style="
        text-align:center;
        padding-top:35px;
        margin-bottom:35px;
    ">

        <h1 style="
            color:#0b5ed7;
            font-size:34px;
            margin-bottom:10px;
        ">
            Mi Cola de Espera
        </h1>

        <p style="
            color:#666;
            font-size:17px;
            margin-bottom:22px;
        ">
            Consulta los libros que estás esperando.
        </p>

        <a href="/lector"
           class="btn btn-gray">
            Regresar
        </a>

    </section>


    <section style="
        max-width:1000px;
        margin:0 auto;
    ">

        <div id="listaColaLector"
             style="
                display:grid;
                grid-template-columns:
                    repeat(auto-fit, minmax(300px, 1fr));
                gap:20px;
             ">

            <div style="
                background:white;
                padding:30px;
                border-radius:14px;
                text-align:center;
                box-shadow:0 4px 14px rgba(0,0,0,0.08);
            ">
                Cargando cola de espera...
            </div>

        </div>

    </section>

</main>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/lector.js}"></script>

</body>
</html>
