<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Mis Préstamos')}"></head>

<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="admin-container">

    <section style="
        text-align: center;
        padding-top: 35px;
        margin-bottom: 35px;
    ">

        <h1 style="
            color: #0b5ed7;
            font-size: 34px;
            margin-bottom: 10px;
        ">
            Mis Préstamos
        </h1>

        <p style="
            color: #666;
            font-size: 17px;
            margin-bottom: 22px;
        ">
            Consulta tus préstamos abiertos y finalizados.
        </p>

        <a th:href="@{/lector}"
           class="btn btn-gray">
            Regresar
        </a>

    </section>


    <section style="
        max-width: 1100px;
        margin: 0 auto;
    ">

        <div id="mensajePrestamosLector"
             class="mensaje">
        </div>

        <div id="listaPrestamosLector"
             style="
                display: grid;
                grid-template-columns:
                    repeat(auto-fit, minmax(300px, 1fr));
                gap: 20px;
            ">

            <div style="
                background: white;
                border-radius: 12px;
                padding: 30px;
                text-align: center;
                box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            ">
                Cargando préstamos...
            </div>

        </div>

    </section>

</main>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/lector.js}"></script>

</body>

</html>
