<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Panel del Lector')}"></head>

<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="admin-container">

    <section class="admin-header">

        <h1>Panel del Lector</h1>

        <p>
            Bienvenido
            <strong>Lector</strong>
        </p>

    </section>

    <section class="module-grid">

        <a th:href="@{/lector/catalogo}" class="module-card">

            <div class="module-icon">
                📚
            </div>

            <span>Catálogo</span>

        </a>

        <a th:href="@{/lector/prestamos}" class="module-card">

            <div class="module-icon">
                📖
            </div>

            <span>Mis Préstamos</span>

        </a>

        <a th:href="@{/lector/cola}" class="module-card">

            <div class="module-icon">
                ⏳
            </div>

            <span>Mi Cola de Espera</span>

        </a>

    </section>

</main>
<script th:src="@{/js/app.js}"></script>

</body>

</html>
