<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Detalle del Préstamo')}"></head>

<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="admin-container">

    <section style="
        text-align: center;
        padding-top: 35px;
        margin-bottom: 35px;
    ">

        <h1 style="
            color: #0b5ed7;
            font-size: 34px;
            margin-bottom: 10px;
        ">
            Detalle del Préstamo
        </h1>

        <p style="
            color: #666;
            margin-bottom: 22px;
        ">
            Consulta la información de tu préstamo.
        </p>

        <a th:href="@{/lector/prestamos}"
           class="btn btn-gray">
            Regresar
        </a>

    </section>


    <section style="
        max-width: 850px;
        margin: 0 auto 50px auto;
    ">

        <div id="detallePrestamoLector">

            <div style="
                background: white;
                padding: 35px;
                border-radius: 14px;
                text-align: center;
                box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            ">
                Cargando préstamo...
            </div>

        </div>

    </section>

</main>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/lector.js}"></script>

</body>

</html>
