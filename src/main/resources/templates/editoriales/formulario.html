<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Registrar Editorial')}"></head>

<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="form-page">

    <div class="form-card">

        <h1 class="form-title">
            Registrar Editorial
        </h1>

        <div id="mensajeEditorialFormulario"
             class="form-message">
        </div>

        <form id="formNuevaEditorial">

            <div class="form-grid">

                <div class="form-field">
                    <label for="nombreEditorial">
                        Nombre
                    </label>

                    <input type="text"
                           id="nombreEditorial"
                           required>
                </div>

                <div class="form-field">
                    <label for="paisEditorial">
                        País
                    </label>

                    <input type="text"
                           id="paisEditorial">
                </div>

            </div>

            <div class="form-actions">

                <button type="submit"
                        class="btn btn-blue">
                    Registrar
                </button>

                <a th:href="@{/editoriales}"
                   class="btn btn-gray">
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</main>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
