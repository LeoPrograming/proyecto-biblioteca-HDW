<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Editar Editorial')}">
</head>

<body>

<header th:replace="~{fragments/navbar :: navbar}">
</header>

<main class="form-page">

    <div class="form-card">

        <h1 class="form-title">
            Editar Editorial
        </h1>

        <div
                id="mensajeEditarEditorial"
                class="form-message">
        </div>


        <form id="formEditarEditorial">

            <input
                    type="hidden"
                    id="idEditorialEditar">


            <div class="form-grid">

                <div class="form-field">

                    <label for="nombreEditorialEditar">
                        Nombre
                    </label>

                    <input
                            type="text"
                            id="nombreEditorialEditar"
                            required>

                </div>

            </div>


            <div class="form-actions">

                <button
                        type="submit"
                        class="btn btn-blue">
                    Guardar cambios
                </button>

                <a
                        th:href="@{/editoriales}"
                        class="btn btn-gray">
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</main>

<script th:src="@{/js/app.js}">
</script>

</body>
</html>
