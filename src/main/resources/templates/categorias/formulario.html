<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Registrar Categoría')}"></head>

<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="form-page">

    <div class="form-card">

        <h1 class="form-title">
            Registrar Categoría
        </h1>

        <div
                id="mensajeCategoriaFormulario"
                class="form-message">
        </div>

        <form id="formNuevaCategoria">

            <div class="form-grid">

                <div class="form-field">
                    <label for="nombreCategoria">
                        Nombre
                    </label>

                    <input
                            type="text"
                            id="nombreCategoria"
                            required>
                </div>

                <div class="form-field">
                    <label for="descripcionCategoria">
                        Descripción
                    </label>

                    <input
                            type="text"
                            id="descripcionCategoria">
                </div>

                <div class="form-field">
                    <label for="imagenCategoria">
                        Imagen
                    </label>

                    <input
                            type="text"
                            id="imagenCategoria"
                            placeholder="Ingrese la URL de la imagen">
                </div>

                <div class="form-field">

                    <label>
                        Vista previa
                    </label>

                    <div class="categoria-preview-container">

                        <img
                                id="previewCategoriaNueva"
                                class="categoria-preview"
                                alt="Vista previa de categoría"
                                style="display:none;">

                        <span
                                id="previewCategoriaNuevaTexto"
                                class="categoria-sin-imagen">
                            Sin imagen
                        </span>

                    </div>

                </div>

            </div>

            <div class="form-actions">

                <button
                        type="submit"
                        class="btn btn-blue">
                    Registrar
                </button>

                <a
                        th:href="@{/categorias}"
                        class="btn btn-gray">
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</main>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
