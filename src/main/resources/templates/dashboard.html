<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Panel de Administración')}"></head>

<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="admin-container">

    <section class="admin-header">

        <h1>Panel de Administración</h1>

        <p>
            Bienvenido
            <strong id="nombreBienvenida">Administrador</strong>
        </p>

    </section>

    <section class="module-grid">

        <a th:href="@{/lectores}" class="module-card">

            <div class="module-icon">
                👥
            </div>

            <span>Lectores</span>

        </a>

        <a th:href="@{/usuarios}" class="module-card">

            <div class="module-icon">
                👤
            </div>

            <span>Gestión de Usuarios</span>

        </a>

        <a th:href="@{/autores}" class="module-card">

            <div class="module-icon">
                ✍️
            </div>

            <span>Gestión de Autores</span>

        </a>

        <a th:href="@{/editoriales}" class="module-card">

            <div class="module-icon">
                🏢
            </div>

            <span>Gestión de Editoriales</span>

        </a>

        <a th:href="@{/libros}" class="module-card">

            <div class="module-icon">
                📚
            </div>

            <span>Libros</span>

        </a>

        <a th:href="@{/categorias}" class="module-card">

            <div class="module-icon">
                📋
            </div>

            <span>Categorías</span>

        </a>

        <a th:href="@{/prestamos}" class="module-card">

            <div class="module-icon">
                📖
            </div>

            <span>Gestión de Préstamos</span>

        </a>

        <a href="#" class="module-card">

            <div class="module-icon">
                📊
            </div>

            <span>Reportes</span>

        </a>
        <a th:href="@{/vista-bibliotecario}" class="module-card">

            <div class="module-icon">
                👓
            </div>

            <span>Vista como Bibliotecario</span>

        </a>
    </section>

</main>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
