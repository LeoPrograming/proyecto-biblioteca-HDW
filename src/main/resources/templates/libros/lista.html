<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Gestión de Libros')}"></head>

<body>

<header th:replace="~{fragments/navbar :: navbar}"></header>

<main class="management-container">

    <div class="management-header">
        <h1>Gestión de Libros</h1>
    </div>

    <div class="action-bar">

        <button
                class="btn btn-blue"
                id="btnAgregarLibro">
            Agregar
        </button>

        <button
                class="btn btn-yellow"
                id="btnEditarLibro"
                disabled>
            Editar
        </button>

        <button
                class="btn btn-red"
                id="btnEstadoLibro"
                disabled>
            Cambiar estado
        </button>

        <a
                th:href="@{/dashboard}"
                class="btn btn-gray">
            Regresar
        </a>

    </div>

    <div class="usuarios-search">

        <input
                type="text"
                id="buscarLibro"
                placeholder="Buscar por título o ISBN">

        <button
                class="btn btn-blue"
                id="btnBuscarLibro">
            Buscar
        </button>

        <button
                class="btn btn-gray"
                id="btnLimpiarBusquedaLibro">
            Mostrar todos
        </button>

    </div>

    <div
            id="mensajeLibros"
            class="mensaje">
    </div>

    <div class="table-wrapper">

        <table class="management-table">

            <thead>

            <tr>
                <th></th>
                <th>ID</th>
                <th>Imagen</th>
                <th>Título</th>
                <th>ISBN</th>
                <th>Fecha publicación</th>
                <th>Precio / tiempo</th>
                <th>Categoría</th>
                <th>Editorial</th>
                <th>Autor(es)</th>
                <th>Estado</th>
            </tr>

            </thead>

            <tbody id="tablaLibros">

            <tr>
                <td colspan="11">
                    Cargando libros...
                </td>
            </tr>

            </tbody>

        </table>

    </div>

</main>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
